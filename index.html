<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SaySisten</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="SaySisten">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f2ff;--card:#fff;--tx:#1f1b3a;--mu:#7b7796;--pri:#6d5dfc;--ln:#ece9fb;--sh:0 8px 24px rgba(76,60,180,.08);--idea:#f5a524;--rem:#6d5dfc;--bill:#10b981;--task:#0ea5e9;--bad:#ef4444}
@media(prefers-color-scheme:dark){:root{--bg:#12101f;--card:#1c1930;--tx:#f1efff;--mu:#9a96b8;--ln:#2a2645;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(135deg,#6d5dfc,#a45bff 60%,#ff7ab8);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 20px) 0 56px;border-radius:0 0 32px 32px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top h1{margin:0;font-size:24px;font-weight:800}
.top p{margin:4px 0 0;opacity:.85;font-size:13px}
.ibtn{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;position:relative}
.dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:#bbb;border:2px solid #8a5cff}
.dot.ok{background:#4ade80}.dot.busy{background:#fbbf24}.dot.err{background:#f87171}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:-34px 0 6px}
.stat{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh)}
.stat b{display:block;font-size:22px;font-weight:800}.stat span{font-size:11px;color:var(--mu);font-weight:600}
.banner{background:rgba(255,255,255,.2);border-radius:12px;padding:8px 12px;font-size:12px;margin-top:12px}
h3.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:20px 4px 8px;font-weight:700}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--pri))}
.card.done{opacity:.55}.card.done .t{text-decoration:line-through}
.card .body{flex:1;min-width:0}
.t{font-weight:700;font-size:15px;word-break:break-word}
.m{font-size:12px;color:var(--mu);margin-top:3px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c,var(--pri)) 14%,transparent);color:var(--c,var(--pri))}
.chip.bad{--c:var(--bad)}.chip.ok{--c:var(--bill)}
.badge{width:46px;height:50px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);display:grid;place-items:center;text-align:center;line-height:1.05;font-weight:800;font-size:18px;flex:none}
.badge small{display:block;font-size:10px;font-weight:700;opacity:.8}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;flex:none;color:#fff}
.chk.on{background:var(--c,var(--bill));border-color:var(--c,var(--bill))}.chk svg{width:16px;height:16px;stroke-width:3}
.acts{display:flex;gap:4px;margin-top:8px}
.mini{font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--bg);color:var(--mu);display:inline-flex;gap:4px;align-items:center}
.mini svg{width:13px;height:13px}.mini.on{color:var(--idea)}
.cap{display:flex;gap:8px;margin-top:18px;background:var(--card);padding:8px;border-radius:20px;box-shadow:var(--sh)}
.cap input{flex:1;border:0;background:none;font:inherit;color:var(--tx);padding:8px 10px;outline:0;min-width:0}
.go{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#6d5dfc,#a45bff);color:#fff;display:grid;place-items:center}
.sum{background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;border-radius:22px;padding:18px;margin-top:18px;box-shadow:var(--sh)}
.sum small{opacity:.85;font-weight:600}.sum b{display:block;font-size:26px;font-weight:800;margin:2px 0 10px}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.empty{text-align:center;color:var(--mu);padding:46px 20px;font-size:14px}.empty div{font-size:40px;margin-bottom:8px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(528px,calc(100% - 32px));display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:8px;box-shadow:0 10px 30px rgba(60,40,160,.2);z-index:5}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;font-size:11px;font-weight:700;color:var(--mu)}
nav button.on{color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent)}
.fab{position:fixed;right:max(20px,calc(50% - 264px));bottom:calc(94px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:20px;background:linear-gradient(135deg,#6d5dfc,#ff7ab8);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px rgba(109,93,252,.45);z-index:6}
.navbadge{position:absolute;top:0;right:13%;min-width:18px;height:18px;padding:0 4px;border-radius:20px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--card)}
nav button{position:relative}.pending-label{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#dc4760;font-weight:800}.mini.pending{background:rgba(239,68,68,.10);color:#ef4444}.mini.active{background:rgba(16,185,129,.12);color:#059669}.notice{background:var(--card);border-radius:17px;padding:12px 14px;margin-top:13px;box-shadow:var(--sh);font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.notice b{color:var(--bad)}
.fab svg{width:26px;height:26px;stroke-width:2.5}
#scrim{position:fixed;inset:0;background:rgba(15,10,40,.45);opacity:0;pointer-events:none;transition:.25s;z-index:20}
#scrim.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transition:.3s cubic-bezier(.2,.8,.2,1);z-index:21}
#sheet.open{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 14px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--bg);padding:4px;border-radius:16px;margin-bottom:14px}
.seg button{padding:8px 0;border-radius:12px;font-size:12px;font-weight:700;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--c);box-shadow:var(--sh)}
.fl{display:block;margin-bottom:12px}.fl span{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:5px}
.fl input,.fl select,.fl textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:11px 13px;outline:0}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--pri)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;padding:14px;border-radius:16px;font-weight:800;background:linear-gradient(135deg,#6d5dfc,#a45bff);color:#fff}
.btn.sec{background:var(--bg);color:var(--tx);flex:none;padding:14px 18px}.btn.del{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);flex:none;padding:14px 18px}
.hint{font-size:12px;color:var(--mu);line-height:1.5;margin:0 0 12px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-80px);background:#1f1b3a;color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;transition:.3s;z-index:40}
#toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div><h1 id="hi"></h1><p id="dt"></p></div><button class="ibtn" data-act="cfg" aria-label="Pengaturan"><i id="ic-cfg"></i><span class="dot" id="dot"></span></button></div>
  <div id="bn"></div>
</div></header>
<main class="wrap">
  <div class="stats" id="stats"></div>
  <div id="view"></div>
</main>
<button class="fab" data-act="new" aria-label="Tambah"><i id="ic-plus"></i></button>
<nav id="nav"></nav>
<div id="scrim" data-act="close"></div>
<div id="sheet"><div class="grab"></div><div id="sb"></div></div>
<div id="toast"></div>

<script>
/* ===== util ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DAY=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const fmt=s=>{const d=parse(s);return `${DAY[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`};
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const clampDay=(y,m,d)=>new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const P=d=>`<svg viewBox="0 0 24 24">${d}</svg>`;
const I={
 idea:P('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>'),
 rem:P('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>'),
 bill:P('<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>'),
 task:P('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),
 plus:P('<path d="M12 5v14M5 12h14"/>'),check:P('<path d="M20 6 9 17l-5-5"/>'),
 pin:P('<path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/>'),
 cfg:P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>')
};
const TYPES={idea:['Ide','var(--idea)','idea'],reminder:['Pengingat','var(--rem)','rem'],bill:['Tagihan','var(--bill)','bill'],task:['Tugas','var(--task)','task']};
const REMIND=[[0,'Tepat waktu'],[10,'10 menit sebelum'],[30,'30 menit sebelum'],[60,'1 jam sebelum'],[180,'3 jam sebelum'],[1440,'1 hari sebelum'],[4320,'3 hari sebelum'],[10080,'1 minggu sebelum']];

/* ===== state ===== */
let items=LS('a.items',[]),cfg=LS('a.cfg',{url:'',token:'',name:''}),queue=LS('a.q',[]),tab='idea',syncState='local',form=null,flushing=false;
const ok=()=>cfg.url&&cfg.token;
const find=id=>items.find(x=>x.id===id);
const persist=()=>{SV('a.items',items);SV('a.q',queue)};
const blank=type=>({id:uid(),type,title:'',note:'',date:'',time:'',place:'',repeat:'none',remind:type==='bill'?1440:30,amount:0,done:false,pinned:false,tag:'',prio:0,paid:'',calId:'',created:new Date().toISOString(),kind:'normal',donorLast:'',donorCount:0,donorInterval:70,donorUnit:'days',donorHistory:[],status:'open',pendingMonths:'',history:[],snoozeUntil:''});
const norm=o=>({...blank(o.type),...o,done:o.done===true||o.done==='true',pinned:o.pinned===true||o.pinned==='true',remind:+o.remind||0,amount:+o.amount||0,prio:+o.prio||0,donorCount:+o.donorCount||0,donorInterval:+o.donorInterval||70,donorHistory:Array.isArray(o.donorHistory)?o.donorHistory:[],status:(['open','pending','done'].includes(o.status)?o.status:'open'),pendingMonths:String(o.pendingMonths||''),history:Array.isArray(o.history)?o.history:[],snoozeUntil:o.snoozeUntil||''});

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2200)}
function setSync(s){syncState=s;$('#dot').className='dot '+({ok:'ok',busy:'busy',err:'err'}[s]||'')}

/* ===== sync ===== */
async function api(body,get){
  const r=get?await fetch(cfg.url+'?token='+encodeURIComponent(cfg.token))
    :await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,...body})});
  const j=await r.json();if(!j.ok)throw new Error(j.error||'Gagal');return j;
}
function enqueue(op){queue=queue.filter(o=>o.id!==op.id);queue.push(op);persist();flush()}
async function flush(){
  if(flushing||!ok()||!navigator.onLine)return;
  flushing=true;
  if(queue.length)setSync('busy');
  try{
    while(queue.length){
      const op=queue[0],j=await api(op);
      if(op.action==='save'&&j.item){const it=find(op.id);if(it)it.calId=j.item.calId||''}
      queue.shift();persist();
    }
    setSync('ok');
  }catch(e){setSync('err');console.warn(e)}
  flushing=false;
}
async function pull(){
  if(!ok())return;
  await flush();
  if(queue.length)return;
  try{setSync('busy');const j=await api({},true);const remote=(Array.isArray(j.items)?j.items:[]).map(norm);const rids=new Set(remote.map(x=>x.id));const localOnly=items.filter(x=>!rids.has(x.id));if(localOnly.length){setSync('err');toast('Ada data lokal berbeda. Backup dahulu; data belum ditimpa.');return}items=remote;persist();setSync('ok');render()}
  catch(e){setSync('err');toast('Sinkron gagal: '+e.message)}
}

/* ===== data ops ===== */
function logAction(it, action, extra={}){it.history=Array.isArray(it.history)?it.history:[];it.history.push({at:new Date().toISOString(),action,...extra});if(it.history.length>200)it.history=it.history.slice(-200)}
function upsert(it){
  const i=items.findIndex(x=>x.id===it.id);
  if(i>=0)items[i]=it;else items.unshift(it);
  persist();render();enqueue({action:'save',id:it.id,item:it});
}
function remove(id){items=items.filter(x=>x.id!==id);persist();render();enqueue({action:'delete',id})}
function addDonorInterval(date,value,unit){
  const d=parse(date),n=Math.max(1,Number(value)||70);
  if(unit==='months')return ymd(clampDay(d.getFullYear(),d.getMonth()+n,d.getDate()));
  d.setDate(d.getDate()+n);return ymd(d);
}
function donorNext(it){return it.donorLast?addDonorInterval(it.donorLast,it.donorInterval,it.donorUnit):it.date||today()}
function donorComplete(id){
  const it=find(id);if(!it||it.kind!=='donor')return;
  const actual=prompt('Tanggal donor yang telah dilakukan (YYYY-MM-DD):',today());
  if(actual===null)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(actual)||ymd(parse(actual))!==actual||actual>today()){toast('Tanggal donor tidak valid');return}
  const lastNumber=Math.max(0,+it.donorCount||0)+1;
  if(!confirm('Catat donor ke-'+lastNumber+' pada '+fmt(actual)+'?'))return;
  it.donorHistory=Array.isArray(it.donorHistory)?it.donorHistory:[];
  it.donorHistory.push({date:actual,number:lastNumber,place:it.place||''});logAction(it,'Donor ke-'+lastNumber,{date:actual,place:it.place||''});
  it.donorCount=lastNumber;it.donorLast=actual;it.date=donorNext(it);it.done=false;it.status='open';
  upsert(it);toast('Donor ke-'+lastNumber+' tercatat ✓');
}
function nextOcc(it){
  if(it.type==='reminder'&&it.kind==='donor')return donorNext(it);
  if(!it.date)return null;
  const t=today();
  if(!it.repeat||it.repeat==='none'||it.date>=t)return it.date;
  const d=parse(it.date),n=new Date();
  if(it.repeat==='weekly'){d.setDate(d.getDate()+Math.ceil(diff(t,it.date)/7)*7);return ymd(d)}
  if(it.repeat==='monthly'){let c=clampDay(n.getFullYear(),n.getMonth(),d.getDate());if(ymd(c)<t)c=clampDay(n.getFullYear(),n.getMonth()+1,d.getDate());return ymd(c)}
  let c=new Date(n.getFullYear(),d.getMonth(),d.getDate());if(ymd(c)<t)c=new Date(n.getFullYear()+1,d.getMonth(),d.getDate());return ymd(c);
}
function billInfo(b){
  const now=new Date(),base=parse(b.date||today()),day=base.getDate();
  // Show oldest unpaid cycle, so unpaid bills are not silently moved to the next month.
  let cursor=new Date(base.getFullYear(),base.getMonth(),1);
  const current=new Date(now.getFullYear(),now.getMonth(),1);
  let due=base,key='',paid=false;
  while(cursor<=current){
    const candidate=clampDay(cursor.getFullYear(),cursor.getMonth(),day);
    const ck=ymd(candidate).slice(0,7);
    if(!(b.paid||'').split(',').includes(ck)){due=candidate;key=ck;break}
    cursor.setMonth(cursor.getMonth()+1);
  }
  if(!key){due=base>now?base:clampDay(now.getFullYear(),now.getMonth()+1,day);key=ymd(due).slice(0,7)}
  paid=(b.paid||'').split(',').includes(key);
  return{due:ymd(due),key,paid,thisMonth:key===today().slice(0,7),left:diff(ymd(due),today()),pending:(b.pendingMonths||'').split(',').includes(key)};
}
function needsAttention(x){
 if(x.type==='idea')return x.status==='pending';
 if(x.type==='bill'){if(x.snoozeUntil&&x.snoozeUntil>today())return false;const b=billInfo(x);return !b.paid&&(b.left<=0||b.pending)}
 if(x.done||x.status==='done')return false;
 if(x.snoozeUntil&&x.snoozeUntil>today())return false;
 if(x.status==='pending')return true;
 const date=x.type==='reminder'?nextOcc(x):x.date;
 if(!date)return false;
 return date<=today();
}
function attentionCounts(){const out={idea:0,reminder:0,bill:0,task:0};items.forEach(x=>{if(out[x.type]!==undefined&&needsAttention(x))out[x.type]++});return out}
function statusBtn(x){return `<button class="mini ${x.status==='pending'?'pending':''}" data-act="pending" data-id="${x.id}">${x.status==='pending'?'↩ Kembali aktif':'⏳ Belum terlaksana'}</button>`}
function snoozeBtn(x){return `<button class="mini" data-act="snooze" data-id="${x.id}">🕒 Tunda</button>`}
function statusChip(x){return x.status==='pending'?'<span class="chip bad">Belum terlaksana</span>':''}

/* ===== render ===== */
function render(){
  const h=new Date().getHours(),g=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  $('#hi').textContent=`${g}${cfg.name?', '+cfg.name:''} 👋`;

function vRem(){
  const L=items.filter(x=>x.type==='reminder'),A=L.filter(x=>!x.done).sort((a,b)=>(nextOcc(a)+(a.time||'09:00')).localeCompare(nextOcc(b)+(b.time||'09:00'))),D=L.filter(x=>x.done);

function collect(){
  const g=id=>{const e=$('#'+id);return e?e.value:undefined};
  const m={title:g('f-title'),tag:g('f-tag'),date:g('f-date'),time:g('f-time'),place:g('f-place'),repeat:g('f-repeat'),amount:g('f-amount'),prio:g('f-prio'),remind:g('f-remind'),note:g('f-note'),status:g('f-status'),kind:g('f-kind'),donorLast:g('f-donorLast'),donorCount:g('f-donorCount'),donorInterval:g('f-donorInterval'),donorUnit:g('f-donorUnit')};
  Object.keys(m).forEach(k=>{if(m[k]!==undefined)form[k]=m[k]});
  const day=g('f-day');if(day!==undefined)form._day=day;
}
function save(){
  collect();const it=form;it.title=it.title.trim();
  if(!it.title){toast('Judul masih kosong');return}
  if(it.type==='bill'){
    const day=Math.min(31,Math.max(1,parseInt(it._day)||0));
    if(!parseInt(it._day)){toast('Isi tanggal jatuh tempo (1-31)');return}
    const n=new Date();let d=clampDay(n.getFullYear(),n.getMonth(),day);
    if(!(it.date&&parse(it.date).getDate()===day)){if(ymd(d)<today())d=clampDay(n.getFullYear(),n.getMonth()+1,day);it.date=ymd(d)}
    it.repeat='monthly';if(!it.time)it.time='09:00';
  }
  if(it.type==='idea'){it.date='';it.repeat='none'}
  if(it.type==='task'){it.repeat='none'}
  if(it.type==='reminder'&&it.kind==='donor'){
    it.donorInterval=Number(it.donorInterval);it.donorCount=Number(it.donorCount);
    if(!Number.isInteger(it.donorInterval)||it.donorInterval<1||!Number.isInteger(it.donorCount)||it.donorCount<0){toast('Interval dan urutan donor harus bilangan bulat valid');return}
    if(it.donorLast&&(!/^\d{4}-\d{2}-\d{2}$/.test(it.donorLast)||ymd(parse(it.donorLast))!==it.donorLast)){toast('Tanggal donor terakhir tidak valid');return}
    it.repeat='none';it.date=donorNext(it);
  }
  if(it.type==='reminder'&&!it.date)it.date=today();
  if(it.type!=='bill'&&it.kind!=='donor')it.done=it.status==='done';
  delete it._day;it.amount=+it.amount||0;it.prio=+it.prio||0;it.remind=+it.remind||0;
  logAction(it,'Disimpan',{status:it.status});upsert(it);closeSheet();toast('Tersimpan ✓');
}

  else if(a==='attn'){const first=['bill','reminder','task','idea'].find(t=>items.some(x=>x.type===t&&needsAttention(x)));if(first){tab=first;render();scrollTo(0,0)}}
  else if(a==='pin'&&it){it.pinned=!it.pinned;upsert(it)}
  else if(a==='paid'&&it){const k=billInfo(it).key,s=new Set((it.paid||'').split(',').filter(Boolean));s.has(k)?s.delete(k):s.add(k);it.paid=[...s].join(',');logAction(it,s.has(k)?'Tagihan lunas':'Pembayaran dibatalkan',{period:k,amount:it.amount});if(s.has(k)){it.pendingMonths=(it.pendingMonths||'').split(',').filter(v=>v&&v!==k).join(',')}upsert(it)}
  else if(a==='conv'&&it){openForm({...it,type:el.dataset.type,date:el.dataset.type==='reminder'?today():'',remind:30})}
  else if(a==='cap')capture()
  else if(a==='cfg')openCfg()
  else if(a==='snooze'&&it){const value=prompt('Tunda perhatian sampai tanggal (YYYY-MM-DD). Kosongkan untuk membatalkan tunda:',it.snoozeUntil||ymd(new Date(Date.now()+86400000)));if(value===null)return;if(value&&(!/^\d{4}-\d{2}-\d{2}$/.test(value)||ymd(parse(value))!==value)){toast('Tanggal tidak valid');return}it.snoozeUntil=value;logAction(it,value?'Ditunda sampai '+value:'Tunda dibatalkan');upsert(it)}
  else if(a==='backup')downloadBackup()
  else if(a==='restore')restorePicker()
  else if(a==='history')openHistory()
  else if(a==='localnotif')requestLocalNotifications()
  else if(a==='update')checkUpdate()
  else if(a==='applyupdate'&&swReg?.waiting)swReg.waiting.postMessage({type:'SKIP_WAITING'})
  else if(a==='install')installPWA()
  else if(a==='cfgsave'){const next={name:$('#c-name').value.trim(),url:$('#c-url').value.trim(),token:$('#c-token').value.trim()};const changed=next.url!==cfg.url||next.token!==cfg.token;if(changed&&next.url&&next.token&&items.length&&!confirm('Backend baru: data lokal dapat berbeda dari cloud. Backup terlebih dahulu. Lanjutkan sambungan tanpa mengganti data lokal secara otomatis?'))return;cfg=next;SV('a.cfg',cfg);closeSheet();render();if(ok()){toast('Menyambungkan…');if(changed){setSync('busy');toast('Sambungan disimpan. Backup & Restore untuk migrasi; data lokal tidak ditimpa.');}else pull()}}
  e.stopPropagation?.();
});

/* ===== local utilities & PWA ===== */
function downloadBackup(){const data={format:'asisten-saya-backup',version:2,exportedAt:new Date().toISOString(),items:items.map(norm)};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='asisten-saya-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup diunduh (tanpa token)')}
function restorePicker(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const raw=JSON.parse(await input.files[0].text());if(raw.format!=='asisten-saya-backup'||!Array.isArray(raw.items)||raw.items.length>10000)throw Error('Format backup tidak valid');const ids=new Set();const restored=raw.items.map(x=>{if(!x||typeof x!=='object'||!TYPES[x.type]||typeof x.id!=='string'||typeof x.title!=='string'||ids.has(x.id))throw Error('Data tidak valid atau ID ganda');ids.add(x.id);return norm(x)});if(!confirm('Restore akan mengganti '+items.length+' data lokal dengan '+restored.length+' data backup. Lanjutkan?'))return;items=restored;queue=restored.map(x=>({action:'save',id:x.id,item:x}));persist();render();closeSheet();toast('Restore berhasil. Periksa sinkronisasi cloud.')}catch(e){toast('Gagal restore: '+e.message)}};input.click()}
function openHistory(){const lines=[];items.forEach(x=>{(x.history||[]).forEach(h=>lines.push({name:x.title||x.type,...h}));(x.donorHistory||[]).forEach(h=>lines.push({name:x.title||'Donor darah',at:(h.date||today())+'T12:00:00',action:'Donor ke-'+h.number,place:h.place}))});lines.sort((a,b)=>String(b.at).localeCompare(String(a.at)));openSheet('<h3>Riwayat aktivitas</h3>'+ (lines.length?lines.slice(0,200).map(h=>`<div class="card"><div class="body"><b>${esc(h.name)}</b><div class="m">${esc(h.action)} · ${esc(String(h.at).slice(0,16).replace('T',' '))}${h.place?' · 📍 '+esc(h.place):''}</div></div></div>`).join(''):'<p class="hint">Belum ada aktivitas yang tercatat.</p>')+'<button class="btn" data-act="close">Tutup</button>')}
async function requestLocalNotifications(){if(!('Notification'in window)){toast('Browser ini belum mendukung notifikasi');return}if(Notification.permission==='granted'){toast('Izin notifikasi sudah diberikan');return}const p=await Notification.requestPermission();toast(p==='granted'?'Notifikasi aktif selama aplikasi terbuka':'Izin notifikasi tidak diberikan')}
const notified=LS('a.notified',{});
function localAlert(){if(document.hidden||!('Notification'in window)||Notification.permission!=='granted')return;let changed=false;const now=Date.now();items.forEach(x=>{if(x.done||x.status==='done'||x.type==='idea')return;const due=x.type==='bill'?billInfo(x).due:(x.type==='reminder'?nextOcc(x):x.date);if(!due)return;const clock=x.time||'09:00',at=new Date(due+'T'+clock+':00').getTime()-(+x.remind||0)*60000;if(!Number.isFinite(at)||now<at||now-at>86400000)return;const key=x.id+'|'+due+'|'+clock;if(notified[key])return;notified[key]=today();changed=true;try{new Notification('SaySisten: '+x.title,{body:'Agenda/tagihan perlu perhatian',icon:'./icons/icon-192.png',tag:key})}catch(e){console.warn(e)}});if(changed){Object.keys(notified).forEach(k=>{if(notified[k]<ymd(new Date(Date.now()-7*86400000)))delete notified[k]});SV('a.notified',notified)}}
setInterval(localAlert,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)localAlert()});
let deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;render()});
async function installPWA(){if(!deferredInstallPrompt){toast('Gunakan menu Chrome ⋮ → Instal aplikasi / Tambahkan ke layar utama');return}deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;render()}
let swReg=null;
async function checkUpdate(){if(!swReg){toast('Pembaruan tersedia setelah aplikasi diakses lewat HTTPS');return}await swReg.update();if(swReg.waiting){showUpdate();return}toast('Pemeriksaan selesai; jika ada versi baru, opsi update akan muncul.')}
function showUpdate(){if(document.getElementById('update-banner'))return;const el=document.createElement('div');el.id='update-banner';el.className='banner';el.innerHTML='Versi baru tersedia <button data-act="applyupdate" style="background:white;color:#6d5dfc;border-radius:8px;padding:7px;margin-left:8px">Perbarui sekarang</button>';document.querySelector('#bn').prepend(el)}
if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').then(r=>{swReg=r;if(r.waiting)showUpdate();r.addEventListener('updatefound',()=>{const worker=r.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})})}).catch(e=>console.warn('Service worker:',e));let refreshing=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}})}

/* ===== init ===== */
$('#ic-cfg').outerHTML=I.cfg;$('#ic-plus').outerHTML=I.plus;

items=items.map(norm);render();localAlert();setSync(ok()?'busy':'local');pull();
</script>
</body>
</html>
