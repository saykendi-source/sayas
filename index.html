.btn.sec{background:var(--bg);color:var(--tx);flex:none;padding:14px 18px}.btn.del{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);flex:none;padding:14px 18px}

html{background:var(--bg)}

/* morphing antar tab (View Transitions) + kartu muncul bertahap */

@media(prefers-reduced-transparency:reduce){#minibar{background:var(--bg)}:root{--glass:linear-gradient(var(--card),var(--card));--sheetbg:linear-gradient(var(--card),var(--card))}nav,#sheet,#scrim,#toast,.ibtn,.syncline,.banner,header,#minibar{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}}

<body>
<header><div class="wrap">
  <div class="top"><div><h1 id="hi"></h1><p id="dt"></p></div><div class="hbtns"><button class="ibtn" data-ui="toggletheme" aria-label="Ganti tema terang/gelap"><i class="ic-theme"></i></button><button class="ibtn" data-act="cfg" aria-label="Pengaturan"><i id="ic-cfg"></i><span class="dot" id="dot"></span></button></div></div>
  <div class="syncline" id="synctxt" data-act="syncnow" role="button" tabindex="0"></div><div id="bn"></div>
</div></header>
<div id="minibar" aria-hidden="true"><div class="wrap"><div class="top"><h2 id="hi2"></h2><div class="hbtns"><button class="ibtn" data-ui="toggletheme" aria-label="Ganti tema terang/gelap" tabindex="-1"><i class="ic-theme"></i></button><button class="ibtn" data-act="cfg" aria-label="Pengaturan" tabindex="-1"><i id="ic-cfg2"></i><span class="dot" id="dot2"></span></button></div></div></div></div>
<main class="wrap">
  <div class="stats" id="stats"></div>
  <div id="view"></div>
</main>
<button class="fab" data-act="new" aria-label="Tambah"><i id="ic-plus"></i></button>
<nav id="nav"></nav>
<div id="scrim" data-act="close"></div>
<div id="sheet"><div class="grab"></div><div id="sb"></div></div>
<div id="toast"></div>

<script>
const APP_VERSION='3.1.0';
/* ===== util ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DAY=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const fmt=s=>{const d=parse(s);return `${DAY[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`};
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const clampDay=(y,m,d)=>new Date(y,m,Math.min(d,new Date(y,m+1,0).getDate()));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const P=d=>`<svg viewBox="0 0 24 24">${d}</svg>`;
const I={
 idea:P('<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>'),
 rem:P('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>'),
 bill:P('<rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/>'),
 task:P('<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>'),
 cart:P('<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M3 4h2l2.4 11h11l2-8H6.5"/>'),today:P('<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>'),plus:P('<path d="M12 5v14M5 12h14"/>'),check:P('<path d="M20 6 9 17l-5-5"/>'),
 pin:P('<path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/>'),
 cfg:P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>')
};
const TYPES={idea:['Ide','var(--idea)','idea'],reminder:['Pengingat','var(--rem)','rem'],bill:['Tagihan','var(--bill)','bill'],task:['Tugas','var(--task)','task'],shopping:['Rutinitas','var(--bill)','cart']};
const REMIND=[[0,'Tepat waktu'],[10,'10 menit sebelum'],[30,'30 menit sebelum'],[60,'1 jam sebelum'],[180,'3 jam sebelum'],[1440,'1 hari sebelum'],[4320,'3 hari sebelum'],[10080,'1 minggu sebelum'],[20160,'2 minggu sebelum'],[40320,'4 minggu sebelum']];

/* ===== state ===== */
let items=LS('a.items',[]),cfg=LS('a.cfg',{url:'',token:'',name:''}),queue=LS('a.q',[]),tab='today',syncState='local',form=null,flushing=false;
const ok=()=>cfg.url&&cfg.token;
const find=id=>items.find(x=>x.id===id);
const persist=()=>{SV('a.items',items);SV('a.q',queue)};
const blank=type=>({id:uid(),type,title:'',note:'',date:'',time:'',place:'',repeat:'none',remind:type==='bill'?1440:30,amount:0,done:false,pinned:false,tag:'',prio:0,paid:'',calId:'',created:new Date().toISOString(),kind:'normal',donorLast:'',donorCount:0,donorInterval:70,donorUnit:'days',donorHistory:[],status:'open',pendingMonths:'',history:[],snoozeUntil:'',taxPreset:'custom',taxEvery:12,taxLast:''});
const norm=o=>({...blank(o.type),...o,done:o.done===true||o.done==='true',pinned:o.pinned===true||o.pinned==='true',remind:+o.remind||0,amount:+o.amount||0,prio:+o.prio||0,donorCount:+o.donorCount||0,donorInterval:+o.donorInterval||70,donorHistory:Array.isArray(o.donorHistory)?o.donorHistory:[],status:(['open','pending','done'].includes(o.status)?o.status:'open'),pendingMonths:String(o.pendingMonths||''),history:Array.isArray(o.history)?o.history:[],snoozeUntil:o.snoozeUntil||'',taxPreset:o.taxPreset||'custom',taxEvery:(o.taxEvery===''||o.taxEvery==null)?12:(+o.taxEvery||0),taxLast:o.taxLast||''});

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),3200)}
function setSync(s){syncState=s;{const c='dot '+({ok:'ok',busy:'busy',err:'err'}[s]||'');$('#dot').className=c;$('#dot2').className=c}updSyncTxt()}

/* ===== sync ===== */
async function api(body,get){
  const r=get?await fetch(cfg.url+'?token='+encodeURIComponent(cfg.token))
    :await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:cfg.token,...body})});
  const j=await r.json();if(!j.ok){const er=new Error(j.error||'Gagal');er.server=true;throw er}return j;
}
function enqueue(op){queue=queue.filter(o=>o.id!==op.id);queue.push(op);persist();flush()}
const dropable=e=>e&&e.server&&!/token|aksi tidak dikenal|lock|timeout|server error/i.test(String(e.message));
function rejectOp(op,e){const f=LS('a.failed',[]);f.push({at:new Date().toISOString(),action:op.action,id:op.id,error:String(e.message||e)});SV('a.failed',f.slice(-30));toast('1 perubahan ditolak server dan dilewati: '+(e.message||''))}
let lastSyncAt=LS('a.lastsync','');
function markSynced(){lastSyncAt=new Date().toISOString();SV('a.lastsync',lastSyncAt);updSyncTxt()}
function updSyncTxt(){try{const el=$('#synctxt');if(!el)return;const q=queue.length+shopDirty.length+vehicleDirty.length;el.textContent=!ok()?'Mode lokal · ketuk ⚙ untuk menyambungkan':syncState==='err'?'Gagal sinkron · ketuk untuk coba lagi':syncState==='busy'?'Menyinkronkan…':q?q+' perubahan menunggu · ketuk untuk kirim':'Tersinkron'+(lastSyncAt?' '+new Date(lastSyncAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'')}catch(e){}}
async function flush(){
  if(flushing||!ok()||!navigator.onLine)return;
  flushing=true;
  if(queue.length)setSync('busy');
  try{
    while(queue.length){
      const op=queue[0];let j;
      try{j=await api(op)}catch(e){if(dropable(e)){rejectOp(op,e);queue.shift();persist();continue}throw e}
      if(op.action==='save'&&j.item){const it=find(op.id);if(it)it.calId=j.item.calId||''}
      queue.shift();persist();
    }
    setSync('ok');markSynced();
  }catch(e){setSync('err');console.warn(e)}
  flushing=false;
}
let lastPull=0,pendingRemote=null;
function askSync(n,m){openSheet(`<h3>Data belum sama</h3><p class="hint">Ada <b>${n}</b> item di HP ini yang tidak ada di server (server berisi ${m} item). Pilih tindakan:</p><div class="btns"><button class="btn" data-act="pushlocal">Gabungkan: kirim ke server</button></div><div class="btns"><button class="btn del" data-act="takeremote">Pakai data server (hapus ${n} item lokal)</button></div><div class="btns pair"><button class="btn sec" data-act="backup">⬇ Backup dulu</button><button class="btn sec" data-act="close">Nanti</button></div>`)}
async function pull(force){
  if(!ok())return;
  if(!force&&Date.now()-lastPull<45000)return;
  lastPull=Date.now();
  await flush();
  if(queue.length)return;
  try{setSync('busy');const j=await api({},true);if(Array.isArray(j.shopping))shopApplyRemote(j.shopping);if(Array.isArray(j.vehicles))vehicleApplyRemote(j.vehicles);const remote=(Array.isArray(j.items)?j.items:[]).map(norm);const rids=new Set(remote.map(x=>x.id));const localOnly=items.filter(x=>!rids.has(x.id));if(localOnly.length){setSync('err');pendingRemote=remote;askSync(localOnly.length,remote.length);return}items=remote;persist();setSync('ok');markSynced();render()}
  catch(e){setSync('err');toast('Sinkron gagal: '+e.message)}
}

/* ===== data ops ===== */
function logAction(it, action, extra={}){it.history=Array.isArray(it.history)?it.history:[];it.history.push({at:new Date().toISOString(),action,...extra});if(it.history.length>50)it.history=it.history.slice(-50)}
function upsert(it){
  const i=items.findIndex(x=>x.id===it.id);
  if(i>=0)items[i]=it;else items.unshift(it);
  persist();render();enqueue({action:'save',id:it.id,item:it});
}
function remove(id){items=items.filter(x=>x.id!==id);persist();render();enqueue({action:'delete',id})}
function addDonorInterval(date,value,unit){
  const d=parse(date),n=Math.max(1,Number(value)||70);
  if(unit==='months')return ymd(clampDay(d.getFullYear(),d.getMonth()+n,d.getDate()));
  d.setDate(d.getDate()+n);return ymd(d);
}
function donorNext(it){return it.donorLast?addDonorInterval(it.donorLast,it.donorInterval,it.donorUnit):it.date||today()}
function donorComplete(id){
  const it=find(id);if(!it||it.kind!=='donor')return;
  const lastNumber=Math.max(0,+it.donorCount||0)+1;
  askSheet('Catat donor ke-'+lastNumber,'date',today(),'Tanggal donor yang telah dilakukan',actual=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(actual)||ymd(parse(actual))!==actual||actual>today()){toast('Tanggal donor tidak valid');return}
    it.donorHistory=Array.isArray(it.donorHistory)?it.donorHistory:[];
    it.donorHistory.push({date:actual,number:lastNumber,place:it.place||''});logAction(it,'Donor ke-'+lastNumber,{date:actual,place:it.place||''});
    it.donorCount=lastNumber;it.donorLast=actual;it.date=donorNext(it);it.done=false;it.status='open';
    upsert(it);toast('Donor ke-'+lastNumber+' tercatat ✓');
  });
}
function nextOcc(it){
  if(it.type==='reminder'&&it.kind==='donor')return donorNext(it);
  if(!it.date)return null;
  const t=today();
  if(!it.repeat||it.repeat==='none'||it.date>=t)return it.date;
  const d=parse(it.date),n=new Date();
  if(it.repeat==='weekly'){d.setDate(d.getDate()+Math.ceil(diff(t,it.date)/7)*7);return ymd(d)}
  if(it.repeat==='monthly'){let c=clampDay(n.getFullYear(),n.getMonth(),d.getDate());if(ymd(c)<t)c=clampDay(n.getFullYear(),n.getMonth()+1,d.getDate());return ymd(c)}
  let c=new Date(n.getFullYear(),d.getMonth(),d.getDate());if(ymd(c)<t)c=new Date(n.getFullYear()+1,d.getMonth(),d.getDate());return ymd(c);
}
function billInfo(b){
  const now=new Date(),base=parse(b.date||today()),day=base.getDate();
  // Show oldest unpaid cycle, so unpaid bills are not silently moved to the next month.
  let cursor=new Date(base.getFullYear(),base.getMonth(),1);
  const current=new Date(now.getFullYear(),now.getMonth(),1);
  let due=base,key='',paid=false;
  while(cursor<=current){
    const candidate=clampDay(cursor.getFullYear(),cursor.getMonth(),day);
    const ck=ymd(candidate).slice(0,7);
    if(!(b.paid||'').split(',').includes(ck)){due=candidate;key=ck;break}
    cursor.setMonth(cursor.getMonth()+1);
  }
  if(!key){due=base>now?base:clampDay(now.getFullYear(),now.getMonth()+1,day);key=ymd(due).slice(0,7)}
  paid=(b.paid||'').split(',').includes(key);
  return{due:ymd(due),key,paid,thisMonth:key===today().slice(0,7),left:diff(ymd(due),today()),pending:(b.pendingMonths||'').split(',').includes(key)};
}
function needsAttention(x){
 if(x.type==='idea')return x.status==='pending';
 if(x.type==='bill'){if(x.snoozeUntil&&x.snoozeUntil>today())return false;const b=billInfo(x);return !b.paid&&(b.left<=0||b.pending)}
 if(x.done||x.status==='done')return false;
 if(x.snoozeUntil&&x.snoozeUntil>today())return false;
 if(x.status==='pending')return true;
 if(x.kind==='tax'&&x.date)return diff(x.date,today())<=14;
 const date=x.type==='reminder'?nextOcc(x):x.date;
 if(!date)return false;
 return date<=today();
}
function attentionCounts(){const out={idea:0,reminder:0,bill:0,task:0};items.forEach(x=>{if(out[x.type]!==undefined&&x.kind!=='tax'&&needsAttention(x))out[x.type]++});return out}
function statusBtn(x){return `<button class="mini ${x.status==='pending'?'pending':''}" data-act="pending" data-id="${x.id}">${x.status==='pending'?'↩ Kembali aktif':'⏳ Belum terlaksana'}</button>`}
function snoozeBtn(x){return `<button class="mini" data-act="snooze" data-id="${x.id}">🕒 Tunda</button>`}
function statusChip(x){return x.status==='pending'?'<span class="chip bad">Belum terlaksana</span>':''}

/* ===== render ===== */
function render(){
  const h=new Date().getHours(),g=h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam';
  $('#hi').textContent=$('#hi2').textContent=`${g}${cfg.name?', '+cfg.name:''} 👋`;
  const n=new Date();$('#dt').textContent=`${DAY[n.getDay()]}, ${n.getDate()} ${MON[n.getMonth()]} ${n.getFullYear()}`;

function collect(){
  const g=id=>{const e=$('#'+id);return e?e.value:undefined};
  const m={title:g('f-title'),tag:g('f-tag'),date:g('f-date'),time:g('f-time'),place:g('f-place'),repeat:g('f-repeat'),amount:g('f-amount'),prio:g('f-prio'),remind:g('f-remind'),note:g('f-note'),status:g('f-status'),kind:g('f-kind'),donorLast:g('f-donorLast'),donorCount:g('f-donorCount'),donorInterval:g('f-donorInterval'),donorUnit:g('f-donorUnit'),taxPreset:g('f-taxPreset'),taxEvery:g('f-taxEvery')};
  Object.keys(m).forEach(k=>{if(m[k]!==undefined)form[k]=m[k]});
  const day=g('f-day');if(day!==undefined)form._day=day;
}
function save(){
  collect();const it=form;it.title=it.title.trim();
  if(!it.title){toast('Judul masih kosong');return}
  if(it.type==='bill'){
    const day=Math.min(31,Math.max(1,parseInt(it._day)||0));
    if(!parseInt(it._day)){toast('Isi tanggal jatuh tempo (1-31)');return}
    const n=new Date();let d=clampDay(n.getFullYear(),n.getMonth(),day);
    if(!(it.date&&parse(it.date).getDate()===day)){if(ymd(d)<today())d=clampDay(n.getFullYear(),n.getMonth()+1,day);it.date=ymd(d)}
    it.repeat='monthly';if(!it.time)it.time='09:00';
  }
  if(it.type==='idea'){it.date='';it.repeat='none'}
  if(it.type==='task'){it.repeat='none'}
  if(it.type==='reminder'&&it.kind==='donor'){
    it.donorInterval=Number(it.donorInterval);it.donorCount=Number(it.donorCount);
    if(!Number.isInteger(it.donorInterval)||it.donorInterval<1||!Number.isInteger(it.donorCount)||it.donorCount<0){toast('Interval dan urutan donor harus bilangan bulat valid');return}
    if(it.donorLast&&(!/^\d{4}-\d{2}-\d{2}$/.test(it.donorLast)||ymd(parse(it.donorLast))!==it.donorLast)){toast('Tanggal donor terakhir tidak valid');return}
    it.repeat='none';it.date=donorNext(it);
  }
  if(it.type==='reminder'&&it.kind==='tax'){
    it.taxEvery=Number(it.taxEvery);
    if(!Number.isInteger(it.taxEvery)||it.taxEvery<0||it.taxEvery>600){toast('Isi pengulangan dengan bilangan bulat 0 atau lebih');return}
    if(!it.date||!/^\d{4}-\d{2}-\d{2}$/.test(it.date)){toast('Isi tanggal jatuh tempo');return}
    it.repeat='none';if(!it.time)it.time='09:00';
  }
  if(it.type==='reminder'&&!it.date)it.date=today();
  if(it.type!=='bill'&&it.kind!=='donor')it.done=it.status==='done';
  delete it._day;it.amount=+it.amount||0;it.prio=+it.prio||0;it.remind=+it.remind||0;
  logAction(it,'Disimpan',{status:it.status});upsert(it);closeSheet();toast('Tersimpan ✓');
}

function downloadBackup(){const data={format:'asisten-saya-backup',version:3,exportedAt:new Date().toISOString(),items:items.map(norm),shopping:shopData,vehicles:vehicleData};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='saysisten-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup diunduh (tanpa token)')}
function restorePicker(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const raw=JSON.parse(await input.files[0].text());if(raw.format!=='asisten-saya-backup'||!Array.isArray(raw.items)||raw.items.length>10000)throw Error('Format backup tidak valid');const ids=new Set();const restored=raw.items.map(x=>{if(!x||typeof x!=='object'||!TYPES[x.type]||typeof x.id!=='string'||typeof x.title!=='string'||ids.has(x.id))throw Error('Data tidak valid atau ID ganda');ids.add(x.id);return norm(x)});if(!confirm('Restore akan mengganti '+items.length+' data lokal dengan '+restored.length+' data backup. Lanjutkan?'))return;if(raw.vehicles&&typeof raw.vehicles==='object'&&confirm('Pulihkan juga data Servis Kendaraan dari backup?')){vehicleData=vehicleValidate(raw.vehicles);vehicleDirty=Object.values(vehicleData).map(record=>({id:record.id,record}));vehiclePersist();vehicleFlush()}if(raw.shopping&&typeof raw.shopping==='object'&&confirm('Pulihkan juga data Belanja Bulanan dari backup?')){shopData=shopValidateBackup(raw.shopping);shopDirty=Object.keys(shopData).map(id=>({id,record:shopData[id]}));shopPersist();shopFlush()}items=restored;queue=restored.map(x=>({action:'save',id:x.id,item:x}));persist();render();closeSheet();toast('Restore berhasil. Periksa sinkronisasi cloud.')}catch(e){toast('Gagal restore: '+e.message)}};input.click()}
function openHistory(){const lines=[];items.forEach(x=>{(x.history||[]).forEach(h=>lines.push({name:x.title||x.type,...h}));(x.donorHistory||[]).forEach(h=>lines.push({name:x.title||'Donor darah',at:(h.date||today())+'T12:00:00',action:'Donor ke-'+h.number,place:h.place}))});lines.sort((a,b)=>String(b.at).localeCompare(String(a.at)));openSheet('<h3>Riwayat aktivitas</h3>'+ (lines.length?lines.slice(0,200).map(h=>`<div class="card"><div class="body"><b>${esc(h.name)}</b><div class="m">${esc(h.action)} · ${esc(String(h.at).slice(0,16).replace('T',' '))}${h.place?' · 📍 '+esc(h.place):''}</div></div></div>`).join(''):'<p class="hint">Belum ada aktivitas yang tercatat.</p>')+'<button class="btn" data-act="close">Tutup</button>')}

function shopValidateBackup(x){if(!x||typeof x!=='object'||Array.isArray(x))throw Error('Data belanja tidak valid');let o={};for(const [k,v] of Object.entries(x)){if((k==='template'||/^period:\d{4}-\d{2}$/.test(k))&&v&&typeof v==='object'&&Array.isArray(v.items)&&v.items.length<=1000)o[k]=v}return o}

function shopFinish(){const p=shopCur(),fresh=p.items.filter(i=>i.checked&&!i.skipped&&!(p.sessions||[]).some(s=>(s.itemIds||[]).includes(i.id)));if(!fresh.length){toast('Belum ada pembelian baru yang dicentang');return}const total=fresh.reduce((s,i)=>s+Number((i.actual??i.estimate)||0),0);if(!confirm(`Catat ${fresh.length} barang sebagai sesi belanja dengan total ${rp(total)}? Harga tanpa aktual memakai estimasi.`))return;p.sessions=p.sessions||[];p.sessions.push({id:uid(),at:new Date().toISOString(),itemIds:fresh.map(i=>i.id),count:fresh.length,total});shopSave(p);toast('Sesi belanja tersimpan')}

/* ===== Servis Kendaraan v2.3: data lokal + antrean sinkronisasi ===== */
let routineView='home', vehicleData=LS('s.vehicles',{}),vehicleDirty=LS('s.vehicles.queue',[]),vehicleSending=false;
const vehiclePersist=()=>{SV('s.vehicles',vehicleData);SV('s.vehicles.queue',vehicleDirty)};
const vehNum=v=>Math.max(0,Number(v)||0);
const vehDate=(d,n,unit)=>{const x=parse(d);if(unit==='days')x.setDate(x.getDate()+n);else{const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}return ymd(x)};
const vehicleList=()=>Object.values(vehicleData).filter(x=>x&&!x.deleted).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
function vehicleValidate(input){if(!input||typeof input!=='object'||Array.isArray(input))throw Error('Format kendaraan tidak valid');let o={};for(const [k,v] of Object.entries(input)){if(!v||typeof v!=='object'||typeof v.id!=='string'||k!==v.id||!Array.isArray(v.services)||v.services.length>500)continue;o[k]=v}return o}
function vehicleSave(v){v.updated=new Date().toISOString();vehicleData[v.id]=v;vehicleDirty=vehicleDirty.filter(x=>x.id!==v.id);vehicleDirty.push({id:v.id,record:JSON.parse(JSON.stringify(v))});vehiclePersist();render();vehicleFlush()}
async function vehicleFlush(){if(vehicleSending||!ok()||!navigator.onLine||!vehicleDirty.length)return;vehicleSending=true;try{while(vehicleDirty.length){let op=vehicleDirty[0];try{await api({action:'vehicleSave',record:withCal(op.record)})}catch(e){if(dropable(e))rejectOp({action:'vehicleSave',id:op.id},e);else throw e}vehicleDirty.shift();vehiclePersist()}setSync('ok')}catch(e){setSync('err');console.warn('Vehicle sync:',e);toast('Kendaraan tersimpan lokal, sinkronisasi tertunda')}finally{vehicleSending=false}}
function vehicleApplyRemote(records){const dirty=new Set(vehicleDirty.map(x=>x.id));let changed=false;for(const r of records){if(!r||typeof r.id!=='string'||!Array.isArray(r.services)||dirty.has(r.id))continue;let prev=vehicleData[r.id];if(!prev||String(r.updated)>String(prev.updated||'')){vehicleData[r.id]=r;changed=true}}if(changed){vehiclePersist();render()}}
function withCal(rec){const r=JSON.parse(JSON.stringify(rec));try{const nm=(rec.name||'kendaraan')+(rec.plate?' ('+rec.plate+')':''),T=today(),cal={};
 if(!rec.deleted){const d=vehicleDue(r);
  if(d.dueDate&&d.dueDate>=T)cal.s={date:d.dueDate,title:'Servis '+nm,rm:[1440,0]};
  if(rec.taxDate&&rec.taxDate>=T)cal.t={date:rec.taxDate,title:'Pajak tahunan '+nm+(rec.taxAmount?' - Rp '+Number(rec.taxAmount).toLocaleString('id-ID'):''),rm:[20160,1440]};
  if(rec.plateDate&&rec.plateDate>=T)cal.p={date:rec.plateDate,title:'Ganti plat 5 tahunan '+nm,rm:[40320,10080,1440]}}
 r.cal=cal;r.calDate=cal.s?cal.s.date:'';r.calTitle=cal.s?cal.s.title:''}catch(e){}return r}
function vehicleLast(v){return [...(v.services||[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)))[0]||null}
function vehicleDue(v){const last=vehicleLast(v),ref=last?.date||v.initialDate||'',fromKm=vehNum(last?.km??v.initialKm),days=vehNum(v.interval),dueDate=ref&&days?vehDate(ref,days,v.unit||'months'):null,dueKm=v.kmInterval?fromKm+vehNum(v.kmInterval):null,curKm=v.currentKm===''||v.currentKm==null?null:vehNum(v.currentKm);return {dueDate,dueKm,kmReached:dueKm!==null&&curKm!==null&&curKm>=dueKm,late:!!(dueDate&&dueDate<=today()),last}}
function vehicleAttention(){return vehicleList().filter(v=>{let d=vehicleDue(v);return d.late||d.kmReached||v.pending===true||vehicleTaxAlert(v)}).length}

function addMonths(ds,n){const d=parse(ds);return ymd(clampDay(d.getFullYear(),d.getMonth()+n,d.getDate()))}
function presetDate(p){const n=new Date(),T=today();if(p.md){const a=p.md.split('-').map(Number);let c=new Date(n.getFullYear(),a[0]-1,a[1]);if(ymd(c)<T)c=new Date(n.getFullYear()+1,a[0]-1,a[1]);return ymd(c)}if(p.day){let c=clampDay(n.getFullYear(),n.getMonth(),p.day);if(ymd(c)<T)c=clampDay(n.getFullYear(),n.getMonth()+1,p.day);return ymd(c)}return ''}
function applyTaxPreset(it,key){const p=TAX_PRESETS.find(q=>q.k===key)||TAX_PRESETS[TAX_PRESETS.length-1];if(!it.title||TAX_PRESETS.some(q=>q.l===it.title))it.title=p.k==='custom'?'':p.l;it.taxPreset=p.k;it.taxEvery=p.every;it.remind=p.remind;it.repeat='none';const dd=presetDate(p);if(dd)it.date=dd}
function newTax(key){const it=blank('reminder');it.kind='tax';it.time='09:00';applyTaxPreset(it,key||'pph_spt');return it}
function taxAttention(){return items.filter(x=>x.kind==='tax'&&needsAttention(x)).length}
function dueLabel(ds){const d=diff(ds,today());return d<0?'terlambat '+(-d)+' hari':d===0?'hari ini':d<=60?d+' hari lagi':Math.round(d/30)+' bulan lagi'}
function taxComplete(id){
  const it=find(id);if(!it||it.kind!=='tax')return;
  askSheet('Catat sudah dibayar / dilapor','date',today(),'Tanggal pembayaran atau pelaporan. Jatuh tempo berikutnya dihitung otomatis.',v=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||ymd(parse(v))!==v||v>today()){toast('Tanggal tidak valid');return}
    const every=+it.taxEvery||0;it.taxLast=v;logAction(it,'Pajak dibayar / dilaporkan',{date:v,due:it.date});
    if(every>0){let n=addMonths(it.date,every),g=0;while(n<=today()&&g++<240)n=addMonths(n,every);it.date=n;it.status='open';it.done=false;it.snoozeUntil=''}
    else{it.status='done';it.done=true}
    upsert(it);toast(every>0?'Tercatat ✓ Jatuh tempo berikutnya '+fmt(it.date):'Tercatat ✓ Selesai');
  });
}

function vehicleForm(id){const v=vehicleData[id]||{id:uid(),kind:'motorcycle',name:'',plate:'',currentKm:'',interval:3,unit:'months',kmInterval:3000,services:[],pending:false};openSheet(`<h3>${id?'Ubah':'Tambah'} Kendaraan</h3>${fl('Nama kendaraan',`<input id="vh-name" value="${esc(v.name)}" placeholder="Mis. Honda Vario 160">`)}<div class="row">${fl('Jenis',`<select id="vh-kind"><option value="motorcycle" ${v.kind!=='car'?'selected':''}>Motor</option><option value="car" ${v.kind==='car'?'selected':''}>Mobil</option></select>`)}${fl('Nomor polisi (opsional)',`<input id="vh-plate" value="${esc(v.plate||'')}">`)}</div>${fl('Odometer terbaru (km)',`<input type="number" min="0" id="vh-km" value="${v.currentKm??''}">`)}<div class="row">${fl('Interval servis waktu',`<input type="number" min="1" id="vh-int" value="${v.interval||3}">`)}${fl('Satuan',`<select id="vh-unit"><option value="months" ${v.unit!=='days'?'selected':''}>Bulan</option><option value="days" ${v.unit==='days'?'selected':''}>Hari</option></select>`)}</div>${fl('Interval odometer (km)',`<input type="number" min="0" id="vh-kmint" value="${v.kmInterval??3000}">`)}<h3 class="sec">Pajak kendaraan</h3><div class="row">${fl('Pajak tahunan jatuh tempo',`<input type="date" id="vh-tax" value="${v.taxDate||''}">`)}${fl('Ganti plat 5 tahunan',`<input type="date" id="vh-plate5" value="${v.plateDate||''}">`)}</div>${fl('Estimasi pajak tahunan (Rp)',`<input type="number" min="0" id="vh-taxamt" value="${v.taxAmount||''}">`)}<p class="hint">Tanggal ada di STNK. Pajak tahunan jatuh tempo tiap tahun; ganti plat dan STNK tiap 5 tahun. Kosongkan bila belum ingin dipantau.</p><p class="hint">Isi catatan servis pertama melalui tombol + Catat servis setelah kendaraan disimpan.</p><div class="btns">${id?`<button class="btn del" data-vehicle="delete" data-id="${esc(id)}">Hapus</button>`:''}<button class="btn" data-vehicle="save" data-id="${esc(v.id)}">Simpan</button></div>`);if(!id)vehicleData[v.id]=v}
function vehicleServiceForm(id){const v=vehicleData[id];if(!v)return;openSheet(`<h3>🛠️ Catat servis · ${esc(v.name)}</h3><p class="hint">Mencatat servis aktual akan menjadi acuan jadwal servis berikutnya.</p><div class="row">${fl('Tanggal servis',`<input type="date" id="vs-date" value="${today()}">`)}${fl('Odometer (km)',`<input type="number" min="0" id="vs-km" value="${v.currentKm??''}">`)}</div>${fl('Bengkel',`<input id="vs-workshop" placeholder="Nama bengkel / lokasi">`)}${fl('Jenis pekerjaan',`<textarea id="vs-work" rows="3" placeholder="Ganti oli, filter, rem... "></textarea>`)}${fl('Biaya servis (Rp)',`<input type="number" id="vs-cost" min="0" value="0">`)}<button class="btn" data-vehicle="saveservice" data-id="${esc(id)}">Simpan Servis</button>`)}
function vehicleHistory(id){let v=vehicleData[id];if(!v)return;openSheet(`<h3>Riwayat · ${esc(v.name)}</h3>${[...v.services].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="card" style="display:block"><b>${fmt(x.date)} · ${vehNum(x.km).toLocaleString('id-ID')} km</b><div class="m">${esc(x.workshop||'Bengkel tidak dicatat')} · ${rp(x.cost)}</div><p class="hint">${esc(x.work||'')}</p></div>`).join('')||'<p class="hint">Belum ada riwayat servis.</p>'}${(v.taxHistory||[]).length?'<h3 class="sec">Riwayat pajak</h3>'+[...v.taxHistory].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="card" style="display:block"><b>${fmt(x.date)} ${x.date.slice(0,4)}</b><div class="m">${x.kind==='plat5'?'Ganti plat / STNK 5 tahunan':'Pajak tahunan'}</div></div>`).join(''):''}<button class="btn sec" data-act="close">Tutup</button>`)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-routine],[data-vehicle]');if(!el)return;const act=el.dataset.routine||el.dataset.vehicle,id=el.dataset.id,v=vehicleData[id];if(el.dataset.routine){vt(()=>{routineView=act;render()});return}if(act==='add')vehicleForm();else if(act==='edit')vehicleForm(id);else if(act==='service')vehicleServiceForm(id);else if(act==='history')vehicleHistory(id);else if(act==='save'){const name=$('#vh-name').value.trim(),km=$('#vh-km').value;if(!name||(+km<0)||!Number.isFinite(Number(km))){toast('Nama atau odometer tidak valid');return}let obj=vehicleData[id]||{id,services:[]};Object.assign(obj,{name,kind:$('#vh-kind').value,plate:$('#vh-plate').value.trim(),currentKm:km===''?'':Number(km),interval:Math.max(1,parseInt($('#vh-int').value)||1),unit:$('#vh-unit').value,kmInterval:Math.max(0,parseInt($('#vh-kmint').value)||0),taxDate:$('#vh-tax').value||'',plateDate:$('#vh-plate5').value||'',taxAmount:Math.max(0,Number($('#vh-taxamt').value)||0)});vehicleSave(obj);closeSheet();toast('Kendaraan disimpan')}else if(act==='saveservice'){const date=$('#vs-date').value,km=Number($('#vs-km').value),cost=Number($('#vs-cost').value);if(!date||!$('#vs-km').value||!Number.isFinite(km)||km<0||!Number.isFinite(cost)||cost<0){toast('Isi tanggal, odometer, dan biaya valid');return}const prev=vehicleLast(v);if(prev&&km<vehNum(prev.km)){toast('Odometer tidak boleh kurang dari servis terakhir');return}v.services.push({id:uid(),date,km,workshop:$('#vs-workshop').value.trim(),work:$('#vs-work').value.trim(),cost});v.currentKm=km;v.pending=false;vehicleSave(v);closeSheet();toast('Riwayat servis ditambahkan')}else if(act==='km'){const k=prompt('Odometer terbaru (km)',v.currentKm??'');if(k===null)return;const n=Number(k);if(k===''||!Number.isFinite(n)||n<0){toast('Kilometer tidak valid');return}v.currentKm=n;vehicleSave(v)}else if(act==='paytax')vehTaxPay(id,'tax');else if(act==='payplate')vehTaxPay(id,'plate');else if(act==='pending'){v.pending=!v.pending;vehicleSave(v)}else if(act==='delete'){if(!confirm('Hapus kendaraan dari daftar? Riwayat akan disembunyikan.'))return;v.deleted=true;vehicleSave(v);closeSheet()}e.stopPropagation()});

/* ===== v3.0 gerakan Liquid Glass ===== */
function enterAnim(){const v=$('#view');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');clearTimeout(enterAnim.t);enterAnim.t=setTimeout(()=>v.classList.remove('enter'),900)}
function vt(fn){const run=()=>{fn();enterAnim()};if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches){try{document.startViewTransition(run);return}catch(e){}}run()}
let lensI=-1,lensT=0;const render0=render;
render=function(){render0();const nav=$('#nav'),i=[...nav.children].findIndex(b=>b.classList.contains('on'));if(i<0)return;nav.style.setProperty('--i',i);if(lensI>=0&&i!==lensI){nav.classList.remove('squish');void nav.offsetWidth;nav.classList.add('squish');clearTimeout(lensT);lensT=setTimeout(()=>nav.classList.remove('squish'),700)}lensI=i};

/* ===== v3.1: tema & warna aksen (hanya tampilan, disimpan lokal di HP) ===== */
const ACCENTS=[['purple','Ungu','#6d5dfc','#a45bff'],['blue','Biru','#2f6bff','#2fb4ff'],['teal','Toska','#0f8f9c','#22c3c9'],['green','Hijau','#0e9f6e','#2dd4a0'],['orange','Oranye','#ea5a1f','#ff9a3c'],['pink','Merah muda','#e0428c','#ff7ab8']];
I.sun=P('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
I.moon=P('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>');
I.auto=P('<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>');
let uiTheme=LS('a.theme','auto'),uiAccent=LS('a.accent','purple');
const darkMQ=matchMedia('(prefers-color-scheme: dark)');
const isDark=()=>uiTheme==='dark'||(uiTheme==='auto'&&darkMQ.matches);
function applyUi(){
  const r=document.documentElement;
  if(uiTheme==='auto')delete r.dataset.theme;else r.dataset.theme=uiTheme;
  if(uiAccent==='purple')delete r.dataset.accent;else r.dataset.accent=uiAccent;
  const col=isDark()?'#0a0914':'#eceffb';
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{if(!m.dataset.orig)m.dataset.orig=m.content;m.content=uiTheme==='auto'?m.dataset.orig:col});
  document.querySelectorAll('.ic-theme').forEach(el=>{el.innerHTML=isDark()?I.sun:I.moon});
  document.querySelectorAll('[data-ui=toggletheme]').forEach(b=>b.setAttribute('aria-label',isDark()?'Ganti ke tema terang':'Ganti ke tema gelap'));
  document.querySelectorAll('[data-ui=theme]').forEach(b=>b.classList.toggle('on',b.dataset.v===uiTheme));
  document.querySelectorAll('[data-ui=accent]').forEach(b=>{b.classList.toggle('on',b.dataset.v===uiAccent);b.setAttribute('aria-pressed',b.dataset.v===uiAccent)});
}
function setUi(fn){const go=()=>{fn();applyUi()};if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches){try{document.startViewTransition(go);return}catch(e){}}go()}
function uiPrefsHtml(){
  return `<div class="uisec"><span>Tema</span><div class="uiseg">${[['auto','Otomatis',I.auto],['light','Terang',I.sun],['dark','Gelap',I.moon]].map(([v,l,ic])=>`<button data-ui="theme" data-v="${v}" class="${uiTheme===v?'on':''}">${ic}${l}</button>`).join('')}</div></div>
  <div class="uisec"><span>Warna aksen</span><div class="swatches">${ACCENTS.map(([v,l,a,b])=>`<button data-ui="accent" data-v="${v}" class="${uiAccent===v?'on':''}" style="--a:${a};--b:${b}" aria-label="${l}" aria-pressed="${uiAccent===v}" title="${l}"></button>`).join('')}</div></div>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-ui]');if(!b)return;const k=b.dataset.ui;
  if(k==='toggletheme'){const next=isDark()?'light':'dark';setUi(()=>{uiTheme=next;SV('a.theme',uiTheme)});toast(next==='dark'?'🌙 Tema gelap':'☀️ Tema terang')}
  else if(k==='theme'){setUi(()=>{uiTheme=b.dataset.v;SV('a.theme',uiTheme)})}
  else if(k==='accent'){setUi(()=>{uiAccent=b.dataset.v;SV('a.accent',uiAccent)})}});
darkMQ.addEventListener?.('change',applyUi);
applyUi();
let scrolled=false;const onScroll=()=>{const y=scrollY,on=y>56;if(on!==scrolled){scrolled=on;document.body.classList.toggle('scrolled',on);const mb=$('#minibar');mb.setAttribute('aria-hidden',on?'false':'true');mb.querySelectorAll('button').forEach(b=>b.tabIndex=on?0:-1)}};addEventListener('scroll',onScroll,{passive:true});onScroll();
items=items.map(norm);render();localAlert();updSyncTxt();setInterval(updSyncTxt,5000);setSync(ok()?'busy':'local');pull();
